name: Feed aktualisieren

on:
  schedule:
    - cron: "17 */2 * * *"   # alle zwei Stunden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Änderungen committen
        run: |
          if git diff --quiet -- feed.json; then
            echo "Keine Änderung"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Feed aktualisiert"
          git push
